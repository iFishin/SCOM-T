name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --target x64

      - name: List build output
        run: |
          echo "=== NSIS Bundle ==="
          dir "src-tauri/target/x64-pc-windows-msvc/release/bundle/nsis/" -Recurse
          echo "=== Portable ==="
          dir "src-tauri/target/x64-pc-windows-msvc/release/" -Filter "*portable*"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/x64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x64-pc-windows-msvc/release/*.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --target universal

      - name: List build output
        run: |
          echo "=== DMG Bundle ==="
          find src-tauri/target/universal-apple-darwin/release/bundle -name "*.dmg" -o -name "*.app"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: List build output
        run: |
          echo "=== AppImage Bundle ==="
          find src-tauri/target/release/bundle -name "*.AppImage" -o -name "*.deb"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage





