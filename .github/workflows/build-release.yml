name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build

      - name: Locate and verify portable exe
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\SCOM-T.exe"
          if (Test-Path $exe) {
            Copy-Item $exe "src-tauri\target\release\SCOM-T-portable.exe"
            Write-Host "Portable exe created: $(Get-Item 'src-tauri\target\release\SCOM-T-portable.exe' | Select-Object Length)"
          } else {
            # Try alternate name (Tauri 2 fallback)
            $alt = Get-ChildItem "src-tauri\target\release\*.exe" | Where-Object { $_.Name -notlike "*setup*" } | Select-Object -First 1
            if ($alt) {
              Copy-Item $alt.FullName "src-tauri\target\release\SCOM-T-portable.exe"
              Write-Host "Found alternate exe: $($alt.Name)"
            } else {
              Write-Error "No release exe found!"
              exit 1
            }
          }

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== Bundle ==="
          Get-ChildItem -Recurse "src-tauri\target\release\bundle\" | Select-Object FullName, Length
          Write-Host "=== Portable ==="
          Get-ChildItem "src-tauri\target\release\SCOM-T-portable.exe" | Select-Object FullName, Length

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/SCOM-T-portable.exe





