name: CI

# PR 合并前的质量门禁。发版矩阵（build-release.yml）只在打 tag 时跑，
# 那条链路是最后一道兜底，但回归不该等到发版才被发现。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支连续推送时取消旧运行，省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # `npm run build` = tsc && vite build；这里只跑类型检查，
      # 不装 Rust 工具链、不打包，保持 PR 检查在几分钟内完成。
      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单测
        run: npm test
