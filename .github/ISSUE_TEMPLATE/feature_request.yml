name: ✨ 功能建议
description: 为 SCOM-T 提出新功能或改进建议
title: "[Feature] 简述建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚需求与使用场景，便于评估。
  - type: textarea
    id: motivation
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？什么场景下需要？
      placeholder: 例如：调试时需要对某条指令定时重发，目前只能手动点发送
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望功能
      description: 希望怎么实现？行为或界面如何？
      placeholder: 例如：在发送面板支持定时自动重发，可配置间隔与次数
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      description: 这个建议主要涉及哪个功能（可多选）
      multiple: true
      options:
        - 串口 / TCP 连接
        - 数据发送
        - 日志接收与搜索
        - 指令网格 / 批量
        - 热键
        - 主题 / 布局
        - 设置
        - 其它
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其它实现方式？有无参考工具
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考链接、使用场景等
